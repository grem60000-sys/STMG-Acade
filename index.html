<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STMG Arcade — 16 jeux de révision</title><style>:root{--bg:#0b1636;--navy:#13235b;--navy2:#1d3478;--ink:#14213d;--gold:#ffc83d;--mint:#2fd3a7;--coral:#ff6b6b;--sky:#5ab4ff;--lav:#a78bfa;--card:#ffffff;--soft:#eef2fb;--mut:#5b6785;--ok:#16a34a;--ko:#dc2626;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"DejaVu Sans","Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 15% 0%,#22408f 0,transparent 45%),radial-gradient(circle at 90% 10%,#3a1f6e 0,transparent 40%),var(--bg);color:#fff;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;min-height:44px;border-radius:12px;font-size:1rem}
button:disabled{cursor:default}
.wrap{max-width:1150px;margin:0 auto;padding:18px 16px 60px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.logo{font-size:2rem;font-weight:800;letter-spacing:.5px}
.logo span{color:var(--gold)}
.tag{color:#c9d4f5;font-size:.95rem}
.panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r);padding:16px;margin:14px 0}
.panel h2{margin:0 0 10px;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.step{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:800}
.modes{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.modes button{background:rgba(255,255,255,.1);color:#fff;padding:10px 18px;font-weight:700}
.modes button.on{background:var(--gold);color:var(--ink)}
.modes input{min-height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;padding:0 12px;font-size:1rem;width:170px}
.grp{margin:8px 0 12px}
.grp .gh{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-weight:700;flex-wrap:wrap}
.grp .gh button{background:transparent;color:#c9d4f5;border:1px solid rgba(255,255,255,.25);font-size:.85rem;padding:4px 10px;min-height:34px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.08);color:#fff;border:2px solid transparent;padding:8px 12px;text-align:left;line-height:1.2;font-size:.92rem}
.chip b{display:block;font-size:.78rem;opacity:.8;letter-spacing:.4px;text-transform:uppercase}
.chip.on.eco{background:#ff8a5c;color:#2b1205;border-color:#ffd2bf}
.chip.on.msgn{background:var(--sky);color:#071a33;border-color:#cfe6ff}
.chip.on.mod{background:var(--mint);color:#042a20;border-color:#c5f5e7}
.selall{display:flex;gap:8px;flex-wrap:wrap}
.selall button{background:#fff;color:var(--ink);font-weight:700;padding:8px 16px}
.count{color:var(--gold);font-weight:700;margin-left:auto}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.gcard{background:var(--card);color:var(--ink);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.gcard:hover:not(:disabled){transform:translateY(-3px) rotate(-.4deg);box-shadow:0 10px 0 rgba(0,0,0,.25)}
.gcard .ic{font-size:2rem}
.gcard .nm{font-weight:800;font-size:1.1rem}
.gcard .ds{font-size:.88rem;color:var(--mut);line-height:1.35}
.gcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.pill{font-size:.75rem;background:var(--soft);color:var(--navy);border-radius:20px;padding:3px 9px;font-weight:700}
.gcard .best{position:absolute;top:10px;right:12px;font-size:.78rem;background:var(--gold);color:var(--ink);padding:2px 8px;border-radius:10px;font-weight:700}
.gcard:disabled{opacity:.45;filter:grayscale(.6)}
.gcard .why{font-size:.78rem;color:var(--ko);font-weight:700}
/* game screen */
#game{display:none}
.gbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:rgba(11,22,54,.92);backdrop-filter:blur(6px);padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.gbar .back{background:rgba(255,255,255,.12);color:#fff;padding:8px 14px;font-weight:700}
.gbar .gt{font-weight:800;font-size:1.15rem}
#sb{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pl{background:rgba(255,255,255,.1);border-radius:12px;padding:6px 12px;font-weight:700;border:2px solid transparent;transition:.2s}
.pl.cur{border-color:var(--gold);background:rgba(255,200,61,.18)}
.pl .s{color:var(--gold);margin-left:6px}
#stage{max-width:1000px;margin:0 auto;padding:18px 16px 70px}
.box{background:var(--card);color:var(--ink);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.turn{background:var(--gold);color:var(--ink);border-radius:12px;padding:8px 14px;font-weight:800;margin-bottom:12px;display:inline-block;animation:pop .4s}
.prog{font-size:.85rem;color:#c9d4f5;margin-bottom:8px}
.chtag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:8px;padding:2px 8px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.chtag.eco{background:#ffe1d4;color:#8a2a00}.chtag.msgn{background:#d6ebff;color:#0b3d73}.chtag.mod{background:#d3f7ec;color:#0b5c45}
.q{font-size:1.15rem;font-weight:700;line-height:1.4;margin:4px 0 14px}
.sit{background:var(--soft);border-left:5px solid var(--navy2);padding:10px 12px;border-radius:8px;margin-bottom:10px;line-height:1.45}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--soft);color:var(--ink);text-align:left;padding:12px 14px;border:2px solid #d6def0;font-size:1rem;line-height:1.35;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--navy2);background:#e3e9f9}
.opt .k{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;font-weight:800;margin-right:8px;font-size:.85rem}
.opt.good{background:#dcfce7;border-color:var(--ok)}
.opt.bad{background:#fee2e2;border-color:var(--ko)}
.opt.dim{opacity:.55}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;line-height:1.45;animation:pop .3s}
.fb.ok{background:#dcfce7;color:#14532d}.fb.ko{background:#fee2e2;color:#7f1d1d}.fb.nt{background:#e0e7ff;color:#1e1b4b}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{background:var(--navy);color:#fff;padding:10px 18px;font-weight:700}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn.big{font-size:1.1rem;padding:12px 24px}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s}
/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{min-height:150px;perspective:600px;background:none;padding:0}
.mc .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .45s;transform-style:preserve-3d}
.mc.f .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center}
.mc .fa{background:linear-gradient(135deg,var(--navy2),#3b2a85);color:var(--gold);font-size:2rem;border:2px solid rgba(255,255,255,.2)}
.mc .ba{background:#fff;color:var(--ink);transform:rotateY(180deg);font-size:.78rem;line-height:1.22;border:2px solid #d6def0;overflow:auto}
.mc .ba.t{font-weight:800;font-size:.95rem;background:#fff8e1}
.mc.m .ba{border-color:var(--ok);background:#dcfce7}
/* tri */
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:10px;border:2px dashed #c3cde6;border-radius:12px;margin-bottom:12px;background:#f8faff}
.tok{background:#fff;color:var(--ink);border:2px solid #c3cde6;padding:8px 12px;font-size:.92rem;line-height:1.25;text-align:left;box-shadow:0 2px 0 #c3cde6}
.tok.sel{border-color:var(--gold);background:#fff4cc;box-shadow:0 0 0 3px rgba(255,200,61,.5)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cat{background:var(--soft);border-radius:12px;padding:10px;min-height:120px;border:2px solid #d6def0;text-align:left;display:block;width:100%}
.cat.hot{border-color:var(--gold);background:#fffbea}
.cat h4{margin:0 0 8px;font-size:.95rem;color:var(--navy)}
.cat .tok{display:block;width:100%;margin-bottom:6px}
/* mur */
.wall{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wt{background:var(--soft);color:var(--ink);border:2px solid #d6def0;padding:10px 8px;font-size:.88rem;line-height:1.25;min-height:72px;font-weight:600}
.wt.sel{background:var(--gold);border-color:#e0a800}
.wt.done{color:#fff;border-color:transparent}
.lives{font-size:1.2rem;letter-spacing:2px}
/* chain */
.chain{display:flex;flex-direction:column;gap:8px}
.lk{display:flex;align-items:center;gap:8px;background:var(--soft);border:2px solid #d6def0;border-radius:12px;padding:6px 8px}
.lk .n{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;flex:none}
.lk .tx{flex:1;line-height:1.3}
.lk button{background:#fff;border:2px solid #c3cde6;color:var(--navy);width:44px;padding:0;font-size:1.1rem;font-weight:800}
.lk.mv{animation:pop .25s}
/* trous */
.txt{line-height:2.3;font-size:1.05rem}
.hole{display:inline-block;min-width:110px;min-height:36px;padding:2px 10px;margin:0 2px;border:2px dashed var(--navy2);border-radius:8px;background:#f1f5ff;color:var(--navy);font-weight:700;vertical-align:middle;line-height:1.4;font-size:.98rem}
.hole.full{border-style:solid;background:#fff8e1}
.hole.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,61,.5)}
/* morpion */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:0 auto 14px}
.cell{aspect-ratio:1;background:var(--soft);border:2px solid #d6def0;font-size:3rem;font-weight:800;color:var(--navy)}
.cell.x{color:var(--coral)}.cell.o{color:var(--sky)}
.cell.win{background:#fff4cc}
/* pendu */
.word{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.lt{width:34px;height:44px;border-bottom:3px solid var(--navy);display:grid;place-items:center;font-size:1.4rem;font-weight:800;color:var(--navy)}
.lt.sp{border:none;width:14px}
.lt.ch{border:none}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.kb button{width:44px;background:var(--navy);color:#fff;font-weight:800}
.kb button.u{opacity:.3}
.kb button.h{background:var(--ok)}
.kb button.m{background:var(--ko)}
/* oie */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.sq{background:var(--soft);border-radius:10px;min-height:64px;position:relative;border:2px solid #d6def0;padding:4px;font-size:.75rem;color:var(--mut)}
.sq .ty{font-size:1.2rem;display:block;text-align:center}
.sq .pw{position:absolute;bottom:2px;right:4px;font-size:1.3rem}
.sq.st{background:#d3f7ec}.sq.en{background:#fff4cc}
.dice{font-size:3rem;display:inline-block}
.dice.roll{animation:spin .6s}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(720deg)}}
/* fin */
.podium{text-align:center}
.podium .big{font-size:3.2rem}
.statrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.statrow .lb{width:230px;font-size:.9rem}
.bar{flex:1;height:14px;background:#e5e9f5;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky))}
.statrow .pc{width:52px;text-align:right;font-weight:700;font-size:.9rem}
.timer{height:8px;background:#e5e9f5;border-radius:8px;overflow:hidden;margin-bottom:10px}
.timer i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo .side{background:var(--soft);border-radius:12px;padding:10px}
.duo .side h4{margin:0 0 8px}
.duo .side.lock{opacity:.45}
.mise{display:flex;gap:8px;flex-wrap:wrap}
.mise button{background:var(--soft);color:var(--ink);border:2px solid #d6def0;padding:8px 16px;font-weight:700}
.mise button.on{background:var(--gold);border-color:#e0a800}
.calcin{min-height:48px;font-size:1.2rem;border-radius:12px;border:2px solid #c3cde6;padding:0 12px;width:200px}
.doc{background:#fffbea;border:1px solid #f1d78a;border-radius:10px;padding:10px 12px;margin:8px 0 12px;font-size:.95rem;line-height:1.45}
.answer p{margin:6px 0;line-height:1.45}
.answer b{color:var(--navy)}
.confetti{position:fixed;top:-20px;font-size:1.6rem;pointer-events:none;animation:fall 2.6s linear forwards;z-index:50}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.help{font-size:.85rem;color:var(--mut);margin-top:6px}
footer{color:#8fa0cc;font-size:.8rem;text-align:center;margin-top:20px}
@media (max-width:640px){.mem{grid-template-columns:repeat(3,1fr)}.wall{grid-template-columns:repeat(2,1fr)}.opts.two{grid-template-columns:1fr}.duo{grid-template-columns:1fr}.statrow .lb{width:120px}.board{grid-template-columns:repeat(5,1fr)}}
</style></head>
<body><div id="menu"></div><div id="game"><div class="gbar"><button class="back" id="quit">← Menu</button><div class="gt" id="gtitle"></div><div id="sb"></div></div><div id="stage"></div></div>
<script>const CH=[];
// ===== ÉCONOMIE — Chapitres 1 à 4 (thème 6) =====
CH.push({
id:"E1", mat:"eco", court:"Éco 1", titre:"De l’État gendarme à l’État-providence", calc:"deficit",
no:[
["État gendarme","État limité aux fonctions régaliennes : sécurité intérieure, défense, justice, diplomatie.","Je protège les personnes, les biens et je fais respecter les contrats, mais je ne vais pas plus loin.","Les libéraux du XIXe siècle me jugeaient suffisant."],
["État-providence","État qui intervient largement dans l’économie et le social : protection sociale, redistribution, régulation de l’activité.","Je me suis fortement développé en France après 1945.","Je couvre la maladie, la vieillesse, le chômage."],
["Fonctions régaliennes","Missions de souveraineté de l’État : sécurité, défense, justice, diplomatie, émission de la monnaie.","On les associe au roi : ce sont les missions historiques de l’État.","Police, armée et tribunaux en font partie."],
["Interventionnisme","Courant qui considère que l’État doit intervenir dans l’économie pour corriger les déséquilibres du marché.","Pour moi, le marché laissé seul peut produire crises et chômage.","Je justifie les politiques de relance et la protection sociale."],
["Libéralisme","Courant qui considère que le marché alloue efficacement les ressources et que l’État doit intervenir le moins possible.","Je fais confiance à la concurrence et à la liberté des prix.","Je défends un État réduit à ses fonctions régaliennes."],
["Entreprise publique","Entreprise dont l’État ou une collectivité publique détient la majorité du capital ou le contrôle.","L’État y est actionnaire majoritaire.","La SNCF en est un exemple."],
["Entreprise semi-publique","Entreprise dont le capital est partagé entre des actionnaires publics et privés, l’État y étant souvent minoritaire.","L’État y côtoie des actionnaires privés.","On parle aussi d’économie mixte."],
["Dépenses publiques","Ensemble des dépenses des administrations publiques : fonctionnement, investissement, prestations sociales, intérêts de la dette.","Je regroupe les dépenses de l’État, des collectivités et de la Sécurité sociale.","On me compare souvent au PIB pour mesurer le poids de l’État."],
["Prélèvements obligatoires","Impôts et cotisations sociales versés aux administrations publiques sans contrepartie directe et immédiate.","Je finance les dépenses publiques sans créer de dette.","TVA, impôt sur le revenu et cotisations sociales me composent."],
["Déficit public","Situation où, sur une année, les dépenses des administrations publiques dépassent leurs recettes. C’est un flux.","Je suis un solde négatif mesuré sur une période.","On me compare au plafond européen de 3 % du PIB."],
["Dette publique","Montant total des emprunts accumulés par les administrations publiques et non encore remboursés, à une date donnée. C’est un stock.","Je grossis chaque fois qu’un déficit doit être financé.","On me compare au plafond européen de 60 % du PIB."],
["Administrations publiques","Ensemble formé par l’État, les collectivités territoriales et les administrations de sécurité sociale.","Mon sigle est APU.","Mairies, régions et caisses de Sécurité sociale en font partie."],
["Emprunt public","Mode de financement du déficit par l’émission de titres (obligations, bons du Trésor) achetés par des investisseurs.","Je permets de financer un déficit, mais j’alourdis la dette.","Je prends souvent la forme d’obligations d’État."]
],
qc:[
["La dette publique se distingue du déficit public parce qu’elle est…","un stock mesuré à une date donnée","un flux mesuré sur une année civile","un solde entre recettes et dépenses","une recette fiscale de l’État"],
["Quelle mission relève de l’État gendarme ?","Rendre la justice et assurer la sécurité","Verser des allocations aux familles","Indemniser les personnes au chômage","Financer les retraites des salariés"],
["Recettes publiques : 1 300 Md€ ; dépenses : 1 450 Md€. Le solde public est de…","−150 Md€, soit un déficit","+150 Md€, soit un excédent","−1 450 Md€, soit la dette","2 750 Md€, soit le budget"],
["Un déficit public annuel a pour effet direct de…","augmenter le stock de dette publique","réduire le stock de dette publique","augmenter les prélèvements obligatoires","réduire les dépenses de l’année suivante"],
["Quel mode de financement des dépenses publiques n’engendre pas de dette ?","Les prélèvements obligatoires","L’émission d’obligations d’État","L’emprunt auprès des banques","Les bons du Trésor à court terme"],
["Le courant libéral considère que l’intervention de l’État doit…","se limiter aux fonctions régaliennes","corriger en permanence les résultats du marché","fixer le prix de tous les biens","planifier toute la production"],
["Une entreprise dont l’État détient la majorité du capital est…","une entreprise publique","une entreprise semi-publique","une entreprise privée","une administration publique"],
["Les dépenses publiques regroupent les dépenses…","de l’État, des collectivités et de la Sécurité sociale","de l’État seul, sans les collectivités ni la Sécu","des ménages, des entreprises privées et des banques commerciales","des entreprises publiques et de leurs filiales"]
],
vf:[
["Un pays peut voir sa dette publique augmenter alors que son déficit diminue.",true,"Tant qu’il reste un déficit, même plus petit, il s’ajoute au stock de dette.","La dette ne dépend pas du déficit : elle varie seulement avec les taux d’intérêt fixés par la BCE.","La dette augmente seulement quand le déficit se transforme en excédent budgétaire en fin d’année."],
["L’État-providence se limite à la sécurité, à la justice et à la défense.",false,"Ce sont les fonctions de l’État gendarme ; l’État-providence ajoute la protection sociale.","C’est exact, car en France la protection sociale relève entièrement des assurances privées et des mutuelles.","C’est exact, car l’État-providence est apparu avant l’État gendarme."],
["Le déficit public est un stock.",false,"C’est un flux mesuré sur une année ; c’est la dette qui est un stock.","C’est un stock, car il s’accumule d’une année sur l’autre et se mesure au 31 décembre de chaque année.","C’est un stock, car il se mesure à une date précise : le 31 décembre de chaque année civile."],
["Les cotisations sociales font partie des prélèvements obligatoires.",true,"Elles sont obligatoires et versées aux administrations de sécurité sociale.","Elles sont facultatives, mais l’INSEE les compte avec les impôts par simple convention statistique.","Elles sont versées directement à l’État en échange d’un service public immédiat et individuel."],
["L’interventionnisme considère que le marché s’autorégule parfaitement.",false,"C’est le libéralisme qui le pense ; l’interventionnisme veut corriger le marché.","C’est exact, car pour l’interventionnisme l’État doit seulement fixer les prix et laisser faire le reste.","C’est exact, car l’interventionnisme refuse toute dépense publique."]
],
tri:[
{n:"État gendarme ou État-providence ?",c:["Fonction de l’État gendarme","Fonction de l’État-providence"],i:[["Police nationale",0],["Tribunaux",0],["Armée",0],["Ambassades",0],["Allocations chômage",1],["Assurance maladie",1],["Pensions de retraite",1],["Aides au logement",1]]},
{n:"Flux ou stock ?",c:["Flux (mesuré sur une période)","Stock (mesuré à une date)"],i:[["Déficit public de l’année",0],["Dépenses publiques annuelles",0],["Recettes fiscales de l’année",0],["Intérêts versés dans l’année",0],["Dette publique au 31 décembre",1],["Patrimoine de l’État",1],["Encours des obligations d’État",1],["Capital d’une entreprise publique",1]]}
],

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(a,n){return shuffle(a).slice(0,n);}
function deal(arr,solo,duo){const n=Math.min(G.duo?duo:solo,Math.max(arr.length,G.duo?2:1));let l=[];while(l.length<n)l=l.concat(shuffle(arr));return l.slice(0,n);}
const fr=(x,d=1)=>{const v=Math.round(x*Math.pow(10,d))/Math.pow(10,d);return v.toLocaleString("fr-FR",{maximumFractionDigits:d});};
const nf=x=>Math.round(x).toLocaleString("fr-FR");
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase();
const LS={get(k,d){try{const v=localStorage.getItem("stmgArcade_"+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem("stmgArcade_"+k,JSON.stringify(v));}catch(e){}}};
const MATN={eco:"Économie",msgn:"MSGN",mod:"Modules atelier"};
const chOf=id=>CH.find(c=>c.id===id);
const chTag=id=>{const c=chOf(id);return c?`<span class="chtag ${c.mat}">${esc(c.court)} · ${esc(c.titre)}</span>`:"";};

// Positions équilibrées : chaque position de bonne réponse revient aussi souvent que les autres sur une partie
const DECKS={};
function nextPos(n){if(!DECKS[n]||!DECKS[n].length){let a=[];for(let r=0;r<4;r++)for(let i=0;i<n;i++)a.push(i);DECKS[n]=shuffle(a);}return DECKS[n].pop();}
function arrange(ok,wrongs){const n=wrongs.length+1,p=nextPos(n),w=shuffle(wrongs),o=[];let k=0;for(let i=0;i<n;i++)o.push(i===p?ok:w[k++]);return{opts:o,ans:p};}

// ================== ÉTAT ==================
const S={sel:new Set(LS.get("sel",[])),mode:LS.get("mode","solo"),names:LS.get("names",["Joueur 1","Joueur 2"])};
let G=null;let TIMERS=[];
function later(f,ms){const t=setTimeout(f,ms);TIMERS.push(t);return t;}
function clearTimers(){TIMERS.forEach(clearTimeout);TIMERS.forEach(clearInterval);TIMERS=[];}

function pool(){
  const P={no:[],qc:[],vf:[],tri:[],ch:[],tt:[],cas:[],ar:[],calc:[]};
  for(const c of CH){if(!S.sel.has(c.id))continue;
    (c.no||[]).forEach(x=>P.no.push({ch:c.id,t:x[0],d:x[1],c1:x[2],c2:x[3]}));
    (c.qc||[]).forEach(x=>P.qc.push({ch:c.id,q:x[0],ok:x[1],w:x.slice(2)}));
    (c.vf||[]).forEach(x=>P.vf.push({ch:c.id,s:x[0],v:x[1],ok:x[2],ko:[x[3],x[4]]}));
    (c.tri||[]).forEach(x=>P.tri.push(Object.assign({ch:c.id},x)));
    (c.ch||[]).forEach(x=>P.ch.push(Object.assign({ch:c.id},x)));
    (c.tt||[]).forEach(x=>P.tt.push(Object.assign({ch:c.id},x)));
    (c.cas||[]).forEach(x=>P.cas.push({ch:c.id,sit:x[0],q:x[1],ok:x[2],w:[x[3],x[4],x[5]],exp:x[6]}));
    (c.ar||[]).forEach(x=>P.ar.push(Object.assign({ch:c.id},x)));
    if(c.calc)P.calc.push({ch:c.id,k:c.calc});
  }
  return P;
}
function groups(P){const g=[];P.tri.forEach((t,ti)=>t.c.forEach((name,ci)=>{const it=t.i.filter(x=>x[1]===ci).map(x=>x[0]);if(it.length>=4)g.push({name,items:it,set:ti,ch:t.ch});}));return g;}

// ================== JOUEURS / SCORES ==================
function newGame(id){
  clearTimers();
  const duo=S.mode==="duo";
  G={id,duo,players:duo?[{n:S.names[0]||"Joueur 1",s:0},{n:S.names[1]||"Joueur 2",s:0}]:[{n:S.names[0]||"Joueur",s:0}],turn:0,stats:{},P:pool()};
  renderScore();
}
function renderScore(){if(!G)return;$("#sb").innerHTML=G.players.map((p,i)=>`<div class="pl ${G.duo&&G.turn===i?"cur":""}">${i===0?"🔴":"🔵"} ${esc(p.n)}<span class="s">${p.s} pts</span></div>`).join("");}
function addPts(p,who){if(who===undefined)who=G.turn;G.players[who].s+=p;renderScore();}
function stat(ch,ok){if(!ch)return;const s=G.stats[ch]||(G.stats[ch]={ok:0,n:0});s.n++;if(ok)s.ok++;}
function nextTurn(){if(G.duo){G.turn=1-G.turn;renderScore();}}
const turnBanner=()=>G.duo?`<div class="turn">🎮 À toi de jouer, ${esc(G.players[G.turn].n)} !</div>`:"";
function confetti(n=24){const e=["🎉","⭐","✨","🏆","💡","🎊"];for(let i=0;i<n;i++){const d=document.createElement("div");d.className="confetti";d.textContent=pick(e);d.style.left=rnd(100)+"vw";d.style.animationDelay=(Math.random()*.8)+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),3600);}}

function finish(extra=""){
  clearTimers();
  const g=GAMES.find(x=>x.id===G.id);const best=LS.get("best",{});
  const top=Math.max(...G.players.map(p=>p.s));
  if(!best[g.id]||top>best[g.id]){best[g.id]=top;LS.set("best",best);}
  let head;
  if(G.duo){const [a,b]=G.players;head=a.s===b.s?`<div class="big">🤝</div><h2>Égalité parfaite : ${a.s} partout !</h2>`:`<div class="big">🏆</div><h2>${esc((a.s>b.s?a:b).n)} l’emporte ${Math.max(a.s,b.s)} à ${Math.min(a.s,b.s)} !</h2>`;}
  else head=`<div class="big">${top>0?"🌟":"💪"}</div><h2>${esc(G.players[0].n)} : ${top} points</h2>`;
  const st=Object.entries(G.stats).sort((x,y)=>x[1].ok/x[1].n-y[1].ok/y[1].n);
  const rows=st.map(([id,s])=>{const pc=Math.round(100*s.ok/s.n),c=chOf(id);return`<div class="statrow"><div class="lb">${esc(c.court)} · ${esc(c.titre)}</div><div class="bar"><i style="width:${pc}%"></i></div><div class="pc">${pc} %</div></div>`;}).join("");
  const weak=st.filter(([id,s])=>s.ok/s.n<.6).map(([id])=>chOf(id).court);
  $("#stage").innerHTML=`<div class="box podium">${head}<p>Meilleur score sur ce jeu : <b>${Math.max(top,best[g.id]||0)} pts</b></p></div>
  ${rows?`<div class="box"><h3 style="margin-top:0">📊 Réussite par chapitre</h3>${rows}${weak.length?`<p class="help">À retravailler en priorité : <b>${esc(weak.join(", "))}</b>. Relis le cours puis rejoue en ne sélectionnant que ces chapitres.</p>`:`<p class="help">Bravo, aucun chapitre sous les 60 % !</p>`}</div>`:""}
  ${extra}
  <div class="row"><button class="btn gold big" id="again">🔁 Rejouer</button><button class="btn big" id="tomenu">🏠 Changer de jeu</button></div>`;
  $("#again").onclick=()=>startGame(G.id);$("#tomenu").onclick=showMenu;
  if(top>0)confetti();
}

// ================== QUESTIONS MIXTES ==================
function mixQ(P){
  const types=[];
  if(P.qc.length)types.push("qc","qc");
  if(P.vf.length)types.push("vf");
  if(P.no.length>=4)types.push("dt","td");
  if(P.cas.length)types.push("cas");
  const t=pick(types);
  if(t==="qc"){const x=pick(P.qc),a=arrange(x.ok,x.w);return{ch:x.ch,prompt:esc(x.q),opts:a.opts,ans:a.ans,exp:"Réponse : "+x.ok};}
  if(t==="cas"){const x=pick(P.cas),a=arrange(x.ok,x.w);return{ch:x.ch,prompt:`<div class="sit">${esc(x.sit)}</div>${esc(x.q)}`,opts:a.opts,ans:a.ans,exp:x.exp};}
  if(t==="vf"){const x=pick(P.vf);return{ch:x.ch,prompt:"Vrai ou faux ? "+esc(x.s),opts:["Vrai","Faux"],ans:x.v?0:1,exp:x.ok,two:true};}
  const n=pick(P.no);const same=P.no.filter(y=>y.ch===n.ch&&y.t!==n.t);const oth=P.no.filter(y=>y.ch!==n.ch);
  const others=shuffle(same).concat(shuffle(oth)).slice(0,3);
  if(t==="dt"){const a=arrange(n.t,others.map(o=>o.t));return{ch:n.ch,prompt:`Quelle notion correspond à cette définition ?<div class="sit">${esc(n.d)}</div>`,opts:a.opts,ans:a.ans,exp:`${n.t} : ${n.d}`};}
  const a=arrange(n.d,others.map(o=>o.d));return{ch:n.ch,prompt:`Quelle est la bonne définition de « ${esc(n.t)} » ?`,opts:a.opts,ans:a.ans,exp:`${n.t} : ${n.d}`};
}
// affiche une question dans el ; cb(ok)
function askQ(el,q,cb,opt={}){
  el.innerHTML=`${chTag(q.ch)}<div class="q">${q.prompt}</div><div class="opts ${q.two?"two":""}">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}</div><div class="fbz"></div>`;
  $$(".opt",el).forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=i===q.ans;$$(".opt",el).forEach((x,j)=>{x.disabled=true;if(j===q.ans)x.classList.add("good");else if(j===i)x.classList.add("bad");else x.classList.add("dim");});
    $(".fbz",el).innerHTML=`<div class="fb ${ok?"ok":"ko"}">${ok?"✅ Bien vu !":"❌ Raté."} ${esc(q.exp)}</div>`;stat(q.ch,ok);cb(ok,i);});
}

start(){const ns=sample(G.P.no,6);G.m={cards:shuffle(ns.flatMap((n,i)=>[{k:i,ty:"t",tx:n.t,ch:n.ch},{k:i,ty:"d",tx:n.d,ch:n.ch}])),open:[],found:0,err:0,lock:false};this.draw();},
draw(){const m=G.m;$("#stage").innerHTML=`${turnBanner()}<div class="prog">Paires trouvées : ${m.found}/6 · Erreurs : ${m.err}</div><div class="mem">${m.cards.map((c,i)=>`<button class="mc ${c.f||c.m?"f":""} ${c.m?"m":""}" data-i="${i}"><div class="in"><div class="fa">?</div><div class="ba ${c.ty==="t"?"t":""}">${esc(c.tx)}</div></div></button>`).join("")}</div><p class="help">Une carte « notion » (fond jaune) va avec sa carte « définition ».</p>`;
$$(".mc").forEach(b=>b.onclick=()=>this.flip(+b.dataset.i));},
flip(i){const m=G.m,c=m.cards[i];if(m.lock||c.f||c.m)return;c.f=true;m.open.push(i);this.draw();
 if(m.open.length===2){const[a,b]=m.open.map(j=>m.cards[j]);m.lock=true;
  if(a.k===b.k){later(()=>{a.m=b.m=true;a.f=b.f=false;m.open=[];m.found++;m.lock=false;addPts(10);stat(a.ch,true);this.draw();if(m.found===6){if(!G.duo)addPts(-Math.min(G.players[0].s,m.err*2));finish(G.duo?"":`<div class="box">Score solo : 10 pts par paire, −2 par erreur (${m.err} erreur${m.err>1?"s":""}).</div>`);}},500);}
  else{m.err++;stat(a.ch,false);later(()=>{a.f=b.f=false;m.open=[];m.lock=false;nextTurn();this.draw();},1500);}}}
});

va(){const k=rnd(4);
 if(k===0){const P=R(500,2000,10),CI=Math.round(P*R(25,70)/100/10)*10;const r=P-CI;
  return{t:"Valeur ajoutée",d:`Une PME produit pour ${nf(P)} k€. Ses consommations intermédiaires s’élèvent à ${nf(CI)} k€.`,ask:"Calcule sa valeur ajoutée.",u:"k€",r,dec:0,tol:.5,s:`${nf(P)} − ${nf(CI)} = ${nf(r)} k€`,iq:"Que représente ce montant ?",io:"La richesse créée par l’entreprise, à partager entre les parties prenantes.",ik:["Le bénéfice que l’entreprise reverse en totalité à ses associés.","Le montant des achats réalisés auprès des fournisseurs de l’année."]};}
 if(k===1){const CA=R(400,1500,10),CI=Math.round(CA*R(20,80)/100);const r=(CA-CI)/CA*100;
  return{t:"Taux de valeur ajoutée",d:`CA : ${nf(CA)} k€ ; consommations intermédiaires : ${nf(CI)} k€.`,ask:"Calcule le taux de valeur ajoutée (1 décimale).",u:"%",r,dec:1,tol:.15,s:`VA = ${nf(CA-CI)} k€ ; ${nf(CA-CI)} / ${nf(CA)} × 100 = ${fr(r)} %`,iq:"Quelle lecture est correcte ?",io:`Sur 100 € de CA, ${fr(r)} € correspondent à de la richesse créée.`,ik:[`Sur 100 € de CA, ${fr(r)} € sont reversés aux actionnaires.`,`Sur 100 € de CA, ${fr(100-r)} € correspondent à de la richesse créée.`]};}
 if(k===2){const VA=R(300,1200,10),SP=Math.round(VA*R(45,80)/100);const r=SP/VA*100;
  return{t:"Part de la VA versée aux salariés",d:`VA : ${nf(VA)} k€ ; salaires et cotisations sociales : ${nf(SP)} k€.`,ask:"Calcule la part de la VA revenant aux salariés (1 décimale).",u:"%",r,dec:1,tol:.15,s:`${nf(SP)} / ${nf(VA)} × 100 = ${fr(r)} %`,iq:"Quelle phrase est juste ?",io:`Les salariés reçoivent ${fr(r)} % de la richesse créée par l’entreprise.`,ik:[`Les salariés reçoivent ${fr(r)} % du chiffre d’affaires de l’entreprise.`,`Les actionnaires reçoivent ${fr(r)} % de la richesse créée par l’entreprise.`]};}
 const C=R(80,400,5),V=Math.round(C*(1+R(20,90)/100));const r=(V-C)/C*100;
 return{t:"Taux de marge commerciale",d:`Ventes de marchandises : ${nf(V)} k€ ; coût d’achat des marchandises vendues : ${nf(C)} k€.`,ask:"Calcule le taux de marge commerciale (1 décimale).",u:"%",r,dec:1,tol:.15,s:`Marge = ${nf(V-C)} k€ ; ${nf(V-C)} / ${nf(C)} × 100 = ${fr(r)} %`,iq:"Quelle lecture est correcte ?",io:`Pour 100 € d’achats revendus, l’entreprise dégage ${fr(r)} € de marge.`,ik:[`Pour 100 € de ventes, l’entreprise dégage ${fr(r)} € de bénéfice net.`,`Pour 100 € d’achats revendus, l’entreprise verse ${fr(r)} € de salaires.`]};},
bilan(){const k=rnd(4);
 if(k===0){const ES=R(300,900,10),RS=ES+R(-120,250,10);const r=RS-ES;const pos=r>=0;
  return{t:"FRNG",d:`Ressources stables : ${nf(RS)} k€ ; emplois stables : ${nf(ES)} k€.`,ask:"Calcule le FRNG (signe compris).",u:"k€",r,dec:0,tol:.5,s:`${nf(RS)} − ${nf(ES)} = ${nf(r)} k€`,iq:"Comment interpréter ce FRNG ?",io:pos?"Les ressources stables couvrent les emplois stables et dégagent un surplus.":"Une partie des emplois stables est financée par des ressources à court terme.",ik:pos?["Une partie des emplois stables est financée par des ressources à court terme.","L’entreprise a forcément une trésorerie nette positive cette année."]:["Les ressources stables couvrent les emplois stables et dégagent un surplus.","L’entreprise a forcément une trésorerie nette positive cette année."]};}
 if(k===1){const st=R(40,200,5),cl=R(60,300,5),fo=R(40,250,5),fs=R(10,80,5);const r=st+cl-fo-fs;const pos=r>=0;
  return{t:"BFR",d:`Stocks : ${st} k€ ; créances clients : ${cl} k€ ; dettes fournisseurs : ${fo} k€ ; dettes fiscales et sociales : ${fs} k€.`,ask:"Calcule le BFR (signe compris).",u:"k€",r,dec:0,tol:.5,s:`(${st} + ${cl}) − (${fo} + ${fs}) = ${nf(r)} k€`,iq:"Que signifie ce résultat ?",io:pos?"Le cycle d’exploitation crée un besoin à financer par le FRNG ou la trésorerie.":"Le cycle d’exploitation dégage une ressource qui alimente la trésorerie.",ik:pos?["Le cycle d’exploitation dégage une ressource qui alimente la trésorerie.","Le BFR mesure le financement des investissements de long terme."]:["Le cycle d’exploitation crée un besoin à financer par le FRNG ou la trésorerie.","Le BFR mesure le financement des investissements de long terme."]};}
 if(k===2){const F=R(50,400,10),B=R(50,400,10);const r=F-B;const pos=r>=0;
  return{t:"Trésorerie nette",d:`FRNG : ${F} k€ ; BFR : ${B} k€.`,ask:"Calcule la trésorerie nette (signe compris).",u:"k€",r,dec:0,tol:.5,s:`${F} − ${B} = ${nf(r)} k€`,iq:"Quelle conclusion tirer ?",io:pos?"Le FRNG couvre le BFR : l’entreprise dispose d’un excédent de trésorerie.":"Le FRNG ne couvre pas le BFR : l’entreprise dépend des concours bancaires.",ik:pos?["Le FRNG ne couvre pas le BFR : l’entreprise dépend des concours bancaires.","Le résultat de l’exercice est forcément un bénéfice de ce montant."]:["Le FRNG couvre le BFR : l’entreprise dispose d’un excédent de trésorerie.","Le résultat de l’exercice est forcément une perte de ce montant."]};}
 const CA=R(360,1800,36),j=pick([15,30,45]);const r=CA*j/360;
 return{t:"Délai clients et BFR",d:`Une entreprise réalise ${nf(CA)} k€ de CA par an (année de 360 jours). Elle allonge le délai accordé à ses clients de ${j} jours.`,ask:"De combien augmentent les créances clients ?",u:"k€",r,dec:0,tol:.6,s:`${nf(CA)} × ${j} / 360 = ${nf(r)} k€`,iq:"Quelle conséquence à FRNG constant ?",io:"Le BFR augmente d’autant, ce qui dégrade la trésorerie nette.",ik:["Le BFR diminue d’autant, ce qui améliore la trésorerie nette.","Le FRNG augmente d’autant, ce qui améliore la trésorerie nette."]};},
couts(){const k=rnd(4);
 if(k===0){const Q=R(500,4000,100),D=R(20,90)*Q/10,I=R(10,50)*Q/10;const r=(D+I)/Q;const pv=Math.round(r*(1+R(-15,20)/100)*100)/100;const pos=pv>r;
  return{t:"Coût complet unitaire",d:`Pour ${nf(Q)} unités : charges directes ${nf(D)} € ; quote-part de charges indirectes ${nf(I)} €. Prix de vente unitaire : ${fr(pv,2)} €.`,ask:"Calcule le coût complet unitaire (2 décimales).",u:"€",r,dec:2,tol:.011,s:`(${nf(D)} + ${nf(I)}) / ${nf(Q)} = ${fr(r,2)} €`,iq:"Que conclure en coût complet ?",io:`Le résultat analytique unitaire est ${pos?"positif":"négatif"} : ${fr(pv-r,2)} € par unité.`,ik:[`Le résultat analytique unitaire est ${pos?"négatif":"positif"} : ${fr(r-pv,2)} € par unité.`,`Le résultat analytique est nul, car le prix couvre exactement le coût.`]};}
 if(k===1){const pv=R(20,90),cv=Math.round(pv*R(40,80)/100),q=R(500,5000,100);const r=(pv-cv)*q;
  return{t:"Marge sur coût variable",d:`Prix de vente unitaire : ${pv} € ; coût variable unitaire : ${cv} € ; quantité vendue : ${nf(q)}.`,ask:"Calcule la marge sur coût variable totale.",u:"€",r,dec:0,tol:.5,s:`(${pv} − ${cv}) × ${nf(q)} = ${nf(r)} €`,iq:"Que mesure cette marge ?",io:"Ce qui reste du CA pour couvrir les charges fixes et dégager un résultat.",ik:["Le bénéfice net du produit après déduction de toutes les charges.","Le montant des charges fixes propres au produit sur la période."]};}
 if(k===2){const CA=R(100,400,5),CV=Math.round(CA*R(45,75)/100),CF=R(10,70,5);const r=CA-CV-CF;const pos=r>0;
  return{t:"Marge sur coût spécifique",d:`Produit Delta : CA ${CA} k€ ; coûts variables ${CV} k€ ; charges fixes spécifiques ${CF} k€.`,ask:"Calcule la marge sur coût spécifique (signe compris).",u:"k€",r,dec:0,tol:.5,s:`${CA} − ${CV} − ${CF} = ${r} k€`,iq:"Quelle décision est cohérente ?",io:pos?"Le conserver : il contribue à couvrir les charges communes.":"Envisager son abandon : il ne couvre même pas ses propres charges.",ik:pos?["L’abandonner : il ne couvre même pas ses propres charges.","Peu importe : il n’a aucun effet sur le résultat global."]:["Le conserver : il contribue à couvrir les charges communes.","Peu importe : il n’a aucun effet sur le résultat global."]};}
 const N=R(8,60),Q=N*R(40,220);const r=Q/N;
 return{t:"Productivité",d:`Un atelier de ${N} salariés produit ${nf(Q)} pièces dans la semaine.`,ask:"Calcule la productivité par salarié (pièces par semaine, 1 décimale).",u:"pièces",r,dec:1,tol:.06,s:`${nf(Q)} / ${N} = ${fr(r)} pièces par salarié`,iq:"Quelle lecture est juste ?",io:`Chaque salarié produit en moyenne ${fr(r)} pièces par semaine.`,ik:[`L’atelier produit au total ${fr(r)} pièces par semaine.`,`Chaque pièce nécessite ${fr(r)} salariés pour être produite.`]};},
deficit(){const k=rnd(3);
 if(k===0){const Rc=R(1200,1400,5),D=Rc+R(60,220,5);const r=Rc-D;
  return{t:"Solde public",d:`Recettes publiques de l’année : ${nf(Rc)} Md€ ; dépenses publiques : ${nf(D)} Md€.`,ask:"Calcule le solde public (signe compris).",u:"Md€",r,dec:0,tol:.5,s:`${nf(Rc)} − ${nf(D)} = ${nf(r)} Md€`,iq:"Comment qualifier ce solde ?",io:"C’est un déficit, un flux annuel qui s’ajoute au stock de dette.",ik:["C’est la dette publique, un stock accumulé depuis des années.","C’est un excédent, un flux annuel qui réduit le stock de dette."]};}
 if(k===1){const d0=R(2800,3400,10),df=R(80,200,5);const r=d0+df;
  return{t:"Évolution de la dette",d:`La dette publique s’élève à ${nf(d0)} Md€ au 31 décembre. L’année suivante, le déficit public est de ${df} Md€, entièrement financé par l’emprunt.`,ask:"Calcule la dette en fin d’année suivante.",u:"Md€",r,dec:0,tol:.5,s:`${nf(d0)} + ${df} = ${nf(r)} Md€`,iq:"Que montre ce calcul ?",io:"La dette est un stock : elle augmente du montant du déficit annuel.",ik:["La dette est un flux : elle repart de zéro au début de chaque année.","La dette diminue, car le déficit est remboursé au cours de l’année."]};}
 const pib=R(2600,3000,10),dt=Math.round(pib*R(90,120)/100);const r=dt/pib*100;
 return{t:"Ratio dette / PIB",d:`Dette publique : ${nf(dt)} Md€ ; PIB : ${nf(pib)} Md€.`,ask:"Calcule la dette en % du PIB (1 décimale).",u:"% du PIB",r,dec:1,tol:.15,s:`${nf(dt)} / ${nf(pib)} × 100 = ${fr(r)} %`,iq:"Comment situer ce ratio ?",io:`À ${fr(r)} % du PIB, la dette dépasse le critère européen de 60 % du PIB.`,ik:[`À ${fr(r)} % du PIB, la dette dépasse le critère européen de 3 % du PIB.`,`À ${fr(r)} % du PIB, la dette respecte le critère européen de 60 % du PIB.`]};},
ir(){const k=rnd(3);const imp=R=>{let t=0;const tr=[[11000,28000,.11],[28000,80000,.30],[80000,1e12,.41]];for(const[a,b,x]of tr)if(R>a)t+=(Math.min(R,b)-a)*x;return t;};
 const bar="Barème fictif : 0 % jusqu’à 11 000 € ; 11 % de 11 000 à 28 000 € ; 30 % de 28 000 à 80 000 € ; 41 % au-delà.";
 if(k===0){const Rv=R(15,120)*1000;const r=imp(Rv);
  return{t:"Calcul de l’impôt par tranches",d:`${bar}<br>Revenu imposable d’un foyer : ${nf(Rv)} €.`,ask:"Calcule l’impôt dû (à l’euro près).",u:"€",r,dec:0,tol:1.01,s:`Chaque tranche est taxée à son propre taux, puis on additionne : ${nf(r)} €.`,iq:"Que traduit ce mode de calcul ?",io:"Chaque taux ne s’applique qu’à la part du revenu située dans sa tranche.",ik:["Le taux de la tranche la plus haute s’applique à la totalité du revenu.","Un taux unique s’applique à tous les revenus, quel que soit leur niveau."]};}
 if(k===1){const Rv=R(20,150)*1000;const r=imp(Rv)/Rv*100;
  return{t:"Taux moyen d’imposition",d:`${bar}<br>Revenu : ${nf(Rv)} € ; impôt dû : ${nf(imp(Rv))} €.`,ask:"Calcule le taux moyen d’imposition (1 décimale).",u:"%",r,dec:1,tol:.15,s:`${nf(imp(Rv))} / ${nf(Rv)} × 100 = ${fr(r)} %`,iq:"Que montre la comparaison des taux moyens selon les revenus ?",io:"Le taux moyen augmente avec le revenu : l’impôt est progressif.",ik:["Le taux moyen est identique pour tous : l’impôt est proportionnel.","Le taux moyen baisse avec le revenu : l’impôt est régressif."]};}
 const d1=R(10,14)*1000+R(0,9)*100,d9=Math.round(d1*R(28,45)/10/100)*100;const r=d9/d1;
 return{t:"Rapport interdécile",d:`Niveau de vie annuel : D1 = ${nf(d1)} € ; D9 = ${nf(d9)} € (données fictives).`,ask:"Calcule le rapport interdécile D9/D1 (1 décimale).",u:"",r,dec:1,tol:.06,s:`${nf(d9)} / ${nf(d1)} = ${fr(r)}`,iq:"Quelle lecture est correcte ?",io:`Le plancher des 10 % les plus aisés vaut ${fr(r)} fois le plafond des 10 % les plus modestes.`,ik:[`Les 10 % les plus aisés ont un niveau de vie supérieur de ${fr(r)} % à celui des 10 % les plus modestes.`,`Le plafond des 10 % les plus modestes vaut ${fr(r)} fois le plancher des 10 % les plus aisés.`]};}
};

// ================== MENU ==================
function showMenu(){clearTimers();document.onkeydown=null;G=null;$("#game").style.display="none";$("#menu").style.display="block";renderMenu();window.scrollTo(0,0);}
function renderMenu(){
 const m=$("#menu");const best=LS.get("best",{});const P=pool();
 const grp=mat=>`<div class="grp"><div class="gh">${MATN[mat]} <button data-all="${mat}">Tout</button><button data-none="${mat}">Aucun</button></div><div class="chips">${CH.filter(c=>c.mat===mat).map(c=>`<button class="chip ${mat} ${S.sel.has(c.id)?"on":""}" data-c="${c.id}"><b>${esc(c.court)}</b>${esc(c.titre)}</button>`).join("")}</div></div>`;
 m.innerHTML=`<div class="wrap"><header class="top"><div class="logo">🎮 STMG <span>Arcade</span></div><div class="tag">16 jeux pour réviser en profondeur · Terminale STMG · Économie, MSGN et modules atelier</div></header>
 <div class="panel"><h2><span class="step">1</span> Qui joue ?</h2><div class="modes"><button data-mode="solo" class="${S.mode==="solo"?"on":""}">👤 Solo</button><button data-mode="duo" class="${S.mode==="duo"?"on":""}">👥 À deux</button><input id="n1" value="${esc(S.names[0])}" placeholder="Prénom joueur 1" maxlength="18">${S.mode==="duo"?`<input id="n2" value="${esc(S.names[1])}" placeholder="Prénom joueur 2" maxlength="18">`:""}</div></div>
 <div class="panel"><h2><span class="step">2</span> Quels chapitres ? <span class="count">${S.sel.size} chapitre${S.sel.size>1?"s":""} · ${P.no.length} notions</span></h2>${grp("eco")}${grp("msgn")}${grp("mod")}<div class="selall"><button id="all">✅ Tout le programme</button><button id="none">✖ Tout désélectionner</button></div></div>
 <div class="panel"><h2><span class="step">3</span> Choisis ton jeu</h2>${S.sel.size?"":`<p class="tag">👆 Sélectionne d’abord au moins un chapitre.</p>`}<div class="games">${GAMES.map(g=>{const why=S.sel.size?g.need(P):"Choisis des chapitres.";return`<button class="gcard" data-g="${g.id}" ${why?"disabled":""}>${best[g.id]?`<span class="best">🏆 ${best[g.id]}</span>`:""}<span class="ic">${g.ic}</span><span class="nm">${esc(g.nm)}</span><span class="ds">${esc(g.ds)}</span>${why?`<span class="why">${esc(why)}</span>`:""}<span class="meta"><span class="pill">⏱ ${g.dur}</span><span class="pill">${g.id==="duel"?"👥 duo en écran partagé":g.id==="morpion"||g.id==="course"?"👤 vs Ordi · 👥 duo":"👤 solo · 👥 duo"}</span></span></button>`;}).join("")}</div></div>
 <footer>Institution du Saint-Esprit · Terminale STMG 2026-2027 · Fonctionne hors connexion · Organisations des exemples fictives sauf mention.</footer></div>`;
 const save=()=>{LS.set("sel",[...S.sel]);LS.set("mode",S.mode);LS.set("names",S.names);};
 $$("[data-c]",m).forEach(b=>b.onclick=()=>{const id=b.dataset.c;S.sel.has(id)?S.sel.delete(id):S.sel.add(id);save();renderMenu();});
 $$("[data-all]",m).forEach(b=>b.onclick=()=>{CH.filter(c=>c.mat===b.dataset.all).forEach(c=>S.sel.add(c.id));save();renderMenu();});
 $$("[data-none]",m).forEach(b=>b.onclick=()=>{CH.filter(c=>c.mat===b.dataset.none).forEach(c=>S.sel.delete(c.id));save();renderMenu();});
 $("#all").onclick=()=>{CH.forEach(c=>S.sel.add(c.id));save();renderMenu();};$("#none").onclick=()=>{S.sel.clear();save();renderMenu();};
 $$("[data-mode]",m).forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;save();renderMenu();});
 $("#n1").oninput=e=>{S.names[0]=e.target.value;save();};if($("#n2"))$("#n2").oninput=e=>{S.names[1]=e.target.value;save();};
 $$("[data-g]",m).forEach(b=>b.onclick=()=>startGame(b.dataset.g));
}
function startGame(id){const g=GAMES.find(x=>x.id===id);document.onkeydown=null;newGame(id);$("#menu").style.display="none";$("#game").style.display="block";$("#gtitle").textContent=g.ic+" "+g.nm;window.scrollTo(0,0);g.start();}
document.addEventListener("DOMContentLoaded",()=>{$("#quit").onclick=()=>{if(confirmQuit())showMenu();};showMenu();});
function confirmQuit(){return true;}
</script></body></html>
